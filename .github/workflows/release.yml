name: Release

on:
  workflow_dispatch:

permissions:
  # id-token: trusted publishing do npm (OIDC) e a proveniencia dos pacotes
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Publica so as versoes que ainda nao estao no npm (@rinhany/core,
      # @rinhany/cli, @rinhany/testing e o guarda-chuva rinhany). O site e privado.
      # A primeira publicacao e manual (`pnpm changeset publish` logado no npm):
      # o trusted publishing so se configura num pacote que ja existe. Ate la,
      # o NPM_TOKEN do repositorio cobre o workflow.
      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
