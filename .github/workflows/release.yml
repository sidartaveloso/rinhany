name: Release

# Roda sozinho a cada push na main. Com changesets pendentes, o changesets/action
# abre (ou atualiza) o PR "chore: version packages"; quando esse PR entra na
# main, publica no npm as versoes que ainda nao estao la. O disparo manual fica
# para repetir um release que falhou no meio.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing do npm (OIDC). O publish nao usa token nenhum: o runner
  # troca este id-token por uma credencial efemera, com escopo de um pacote so,
  # e a mesma identidade assina a proveniencia.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sem `version`: a action le o `packageManager` do package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Sem `registry-url`: ele grava um .npmrc com `${NODE_AUTH_TOKEN}`, e um
      # token vazio atrapalha a troca OIDC do trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Os checks antes de publicar: `pnpm build` verde convive com suite
      # vermelha, e o `changeset publish` mandaria assim mesmo para o npm.
      - name: Lint and typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Version PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
